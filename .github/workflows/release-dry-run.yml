name: Release Candidate Dry Run

on:
  workflow_dispatch:
    inputs:
      version:
        description: Expected lockstep package version
        required: true
        default: 0.1.0-rc.1
        type: string

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify requested version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const root = JSON.parse(await readFile('package.json', 'utf8'));
          if (root.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Requested ${process.env.EXPECTED_VERSION}, repository is ${root.version}`);
          }
          EOF
      - run: pnpm check
      - run: pnpm test
      - name: Pack and verify installable artifacts
        env:
          AXRAIL_ARTIFACT_DIR: artifacts/rc-packages
        run: pnpm pack:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axrail-${{ inputs.version }}-packages
          path: artifacts/rc-packages/*.tgz
          if-no-files-found: error
          retention-days: 14
