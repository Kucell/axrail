name: v0.1 Package Migration

on:
  push:
    paths:
      - scripts/release/apply-v01-package-layout.mjs
      - .github/workflows/v01-package-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: node scripts/release/apply-v01-package-layout.mjs
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit v0.1 package layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "build: prepare v0.1 installable package artifacts"
          git push
