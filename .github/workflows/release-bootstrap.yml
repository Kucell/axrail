name: Bootstrap First npm Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Lockstep version to publish
        required: true
        default: 0.1.0-rc.1
        type: string
      confirm:
        description: Type PUBLISH-FIRST-RELEASE to continue
        required: true
        type: string

concurrency:
  group: axrail-bootstrap-release
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      - name: Verify explicit confirmation and version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "PUBLISH-FIRST-RELEASE"
          node --input-type=module <<'EOF'
          import { readFile } from 'node:fs/promises';
          const root = JSON.parse(await readFile('package.json', 'utf8'));
          if (root.version !== process.env.EXPECTED_VERSION) {
            throw new Error(`Requested ${process.env.EXPECTED_VERSION}, repository is ${root.version}`);
          }
          EOF
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Pack and verify exact publish artifacts
        env:
          AXRAIL_ARTIFACT_DIR: artifacts/rc-packages
        run: pnpm pack:smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axrail-bootstrap-${{ inputs.version }}
          path: artifacts/rc-packages/*.tgz
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-release-bootstrap
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Verify protected environment is intentionally configured
        env:
          RELEASE_GUARD: ${{ vars.RELEASE_GUARD }}
        run: test "$RELEASE_GUARD" = "enabled"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: axrail-bootstrap-${{ inputs.version }}
          path: artifacts/rc-packages
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify bootstrap npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm --version
          npm whoami
      - name: Publish verified tarballs with rc dist-tag and provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          packages=(approval artifacts events policy tools validation changesets agent mcp model-openai-compatible cli transactions adapter-sdk hmi-adapter-kit harness)
          for package in "${packages[@]}"; do
            tarball="artifacts/rc-packages/axrail-${package}-${VERSION}.tgz"
            test -f "$tarball"
            npm publish "$tarball" --access public --tag rc --provenance
          done
